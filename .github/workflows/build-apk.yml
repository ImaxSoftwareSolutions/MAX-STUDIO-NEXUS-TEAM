name: Build MAX STUDIO APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log
      - name: Show errors in summary
        if: failure()
        run: |
          {
            echo '### Build errors'
            echo '```'
            grep -n -E "error:|What went wrong|Caused by|FAILED|Could not" -A4 build.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: MAX-STUDIO-debug-apk
          path: app/build/outputs/apk/debug/*.apk
