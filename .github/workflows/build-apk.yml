name: Build MAX STUDIO APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain > build.log 2>&1 || {
            echo "=========== ERRORS ==========="
            grep -n -E "error:|What went wrong|Execution failed|e: file|AAPT|FAILED" -A4 build.log | head -80
            echo "=========== LAST 40 LINES ==========="
            tail -40 build.log
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MAX-STUDIO-debug-apk
          path: app/build/outputs/apk/debug/*.apk
